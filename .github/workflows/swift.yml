name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Build MacNexaCore
      run: swift build -v

    - name: Run Swift Unit Tests
      run: swift test -v

    - name: Compile Universal Native Engine
      run: ./run.sh --build-only
