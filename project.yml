name: MacNexa
options:
  bundleIdPrefix: com.macnexa
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  MacNexaCore:
    path: MacNexaCore

targets:
  MacNexa:
    type: application
    platform: macOS
    sources:
      - MacNexa
    dependencies:
      - package: MacNexaCore
        product: MacNexaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macnexa.app
        INFOPLIST_FILE: MacNexa/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ad-hoc signing by default so the project builds on any Mac with no
        # setup. Debug builds use the encrypted file store (see below), so they
        # don't touch the Keychain and don't need a stable signature to avoid
        # the login-keychain prompt. If you specifically want Keychain-backed
        # storage in Debug without repeated prompts, create the optional
        # "MacNexa Dev" identity (scripts/create-signing-cert.sh) and set
        # CODE_SIGN_IDENTITY yourself — it is not required.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Disable the Xcode "debug dylib" split so Debug builds produce a single
        # executable. The split signs the main binary and MacNexa.debug.dylib
        # separately, which can trigger a dyld "different Team IDs" load failure
        # when signing identities differ between them.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          # Local dev: non-sandboxed so ad-hoc-signed builds launch.
          CODE_SIGN_ENTITLEMENTS: MacNexa/Resources/MacNexa-Debug.entitlements
          # Default Debug builds to the encrypted file store (no Keychain), so
          # the login-keychain prompt never appears during development and the
          # app behaves like it would on an MDM-locked Mac. Release still
          # defaults to the Keychain.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MACNEXA_FILE_SECRETS
        Release:
          # Distribution: full sandbox + hardened runtime (spec §43).
          CODE_SIGN_ENTITLEMENTS: MacNexa/Resources/MacNexa.entitlements

schemes:
  MacNexa:
    build:
      targets:
        MacNexa: all
    run:
      environmentVariables:
        MACNEXA_USE_IOBLUETOOTH: "1"
        # Use the encrypted file store instead of the Keychain when running from
        # Xcode, so the login-keychain prompt does not appear on every launch
        # (and so it works on MDM-managed Macs where the Keychain is blocked).
        MACNEXA_NO_KEYCHAIN: "1"
