name: MacNexa
options:
  bundleIdPrefix: com.macnexa
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  MacNexaCore:
    path: MacNexaCore

targets:
  MacNexa:
    type: application
    platform: macOS
    sources:
      - MacNexa
    dependencies:
      - package: MacNexaCore
        product: MacNexaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macnexa.app
        INFOPLIST_FILE: MacNexa/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Sign with a stable local self-signed identity ("MacNexa Dev") instead
        # of a fresh ad-hoc signature on every build. A stable signature keeps
        # the Keychain access ACL valid across rebuilds, so macOS stops asking
        # for the login password each launch. Create the identity once with
        # scripts/create-signing-cert.sh (see README).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "MacNexa Dev"
        # The Xcode 15+/26 "debug dylib" split (used for previews) signs the
        # main executable and MacNexa.debug.dylib separately; with a custom
        # manual identity their Team IDs can disagree, and dyld then refuses to
        # load the dylib ("different Team IDs"). Disable the split so Debug
        # builds produce a single, consistently signed executable.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          # Local dev: non-sandboxed so ad-hoc-signed builds launch.
          CODE_SIGN_ENTITLEMENTS: MacNexa/Resources/MacNexa-Debug.entitlements
          # Default Debug builds to the encrypted file store (no Keychain), so
          # the login-keychain prompt never appears during development and the
          # app behaves like it would on an MDM-locked Mac. Release still
          # defaults to the Keychain.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MACNEXA_FILE_SECRETS
        Release:
          # Distribution: full sandbox + hardened runtime (spec §43).
          CODE_SIGN_ENTITLEMENTS: MacNexa/Resources/MacNexa.entitlements

schemes:
  MacNexa:
    build:
      targets:
        MacNexa: all
    run:
      environmentVariables:
        MACNEXA_USE_IOBLUETOOTH: "1"
        # Use the encrypted file store instead of the Keychain when running from
        # Xcode, so the login-keychain prompt does not appear on every launch
        # (and so it works on MDM-managed Macs where the Keychain is blocked).
        MACNEXA_NO_KEYCHAIN: "1"
